name: Merge Botocore Sync PRs

on:
  check_run:
    types: completed

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

jobs:
  auto-merge-sync-prs:
    runs-on: ubuntu-latest
    if: github.event.check_run.conclusion == 'success' && startsWith(github.event.check_run.check_suite.head_branch, 'botocore-sync')
    steps:
      - name: Check PR Merge Criteria
        uses: actions/github-script@v7
        id: check-pr
        with:
          script: |
            console.log("Checking PR Merge Criteria");
            const prs = context.payload.check_run.pull_requests;

            if (prs.length !== 1) {
              core.setOutput("auto-merge", "false");
              return core.setFailed('Unexpected number of PRs');
            }

            const pr = prs[0];
            const { data: prDetails } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            // Check if PR is by sagemaker-bot and is a daily sync PR
            const isBotAuthor = prDetails.user.login === "sagemaker-bot";
            const isBotocoreSync = prDetails.head.ref.startsWith("botocore-sync") && prDetails.title.startsWith("Daily Sync with Botocore");

            if (!isBotAuthor || !isBotocoreSync) {
              return core.setFailed('PR does not meet auto-merge criteria');
            } 

            const requiredChecks = [
              'CodeQL',
              'unit-test (3.8)',
              'unit-test (3.9)',
              'unit-test (3.10)',
              'unit-test (3.11)',
              'unit-test (3.12)',
              'integ-tests (3.12)',
              'pylint-codestyle'
            ];

            // Get all check runs for this commit
            const { data: checkRunsData } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.check_run.head_sha
            });

            const checkRunMap = {};
            checkRunsData.check_runs.forEach(run => {
              checkRunMap[run.name] = {
                status: run.status,
                conclusion: run.conclusion
              };
            });

            // Verify all required checks are completed and successful
            const missingChecks = [];
            const failedChecks = [];
            const pendingChecks = [];

            requiredChecks.forEach(checkName => {
              if (!checkRunMap[checkName]) {
                missingChecks.push(checkName);
              } else if (checkRunMap[checkName].status !== 'completed') {
                pendingChecks.push(checkName);
              } else if (!['success', 'skipped', 'neutral'].includes(checkRunMap[checkName].conclusion)) {
                failedChecks.push(checkName);
              }
            });

            // Fail the job if any checks are missing, pending, or failed
            if (missingChecks.length > 0) {
              console.log('Missing required checks:', missingChecks);
              return core.setFailed(`Missing required checks: ${missingChecks.join(', ')}`);
            }
            if (pendingChecks.length > 0) {
              console.log('Pending checks:', pendingChecks);
              return core.setFailed(`Checks still pending: ${pendingChecks.join(', ')}`);
            }
            if (failedChecks.length > 0) {
              console.log('Failed checks:', failedChecks);
              return core.setFailed(`Failed checks: ${failedChecks.join(', ')}`);
            }

            return;
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CODEBUILD_ROLE_ARN }}
          role-duration-seconds: 10800
          aws-region: us-west-2
      - name: Trigger Auto-Merge
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: sagemaker-core-merge-botocore-pr
          env-vars-for-codebuild: |
            PR_NUMBER,
            COMMIT_SHA
        env:
          PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number }}
          COMMIT_SHA: ${{ github.event.check_run.pull_requests[0].head.sha }}
